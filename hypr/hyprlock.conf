general {
    grace = 5
    hide_cursor = true
}

background {
    monitor =
    path = /home/vremyavnikuda/.config/hypr/wallpaper.png
    blur_passes = 2
    blur_size = 6
    color = rgba(17, 17, 27, 1.0)
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    outer_color = rgba(180, 190, 254, 1.0)
    inner_color = rgba(30, 30, 46, 1.0)
