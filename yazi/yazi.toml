# Tuned for this setup (Hyprland + Kitty)
[mgr]
ratio          = [1, 2, 5]     # More room for the right column/preview
sort_by        = "natural"
sort_sensitive = true
sort_reverse   = false
sort_dir_first = true
show_hidden    = false          # Toggle with '.' in the UI
show_symlink   = true

# Previews for different file types
[preview]
max_width  = 800
max_height = 600
cache_dir  = "/tmp/yazi-cache"

[opener]
edit = [
  { run = "kitty nvim %s", block = true, for = "linux" },
]
open = [
  { run = "xdg-open %s", orphan = true, for = "linux" },
]
vscode = [
  { run = "code --new-window %s", orphan = true, for = "linux" },
]
pdf = [
  { run = "zathura %s", orphan = true, for = "linux" },
]
video = [
  { run = "mpv --no-terminal %s", orphan = true, for = "linux" },
]

[open]
rules = [
  # Text files — open in your editor
  { mime = "text/*", use = "edit" },

  # Images — open with the system viewer
  { mime = "image/*", use = "open" },

  # PDF — open in zathura
  { url = "*.pdf", use = "pdf" },

  # Video — open in mpv
  { mime = "video/*", use = "video" },

  # Fallback — open via xdg-open
  { url = "*", use = "open" },
]
